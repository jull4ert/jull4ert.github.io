  <h1>驗證與授權</h1>
  <p class="sub">「你是誰」（驗證）與「你能做什麼」（授權）是兩件事，缺陷常見於授權。</p>
</header>
<main class="page">
<h2>原則</h2><ul><li>使用成熟的身分驗證框架或身分提供者（OIDC／OAuth 2.0），不要自行發明。</li><li>預設拒絕；每個請求在<b>伺服器端</b>檢查「這個人對這個資源」的權限。</li><li>管理者與敏感操作啟用 MFA。</li><li>登入、重設密碼、帳號是否存在的回應訊息一致，並限制嘗試次數。</li></ul><h2>子主題</h2><div id="children"></div>

<h2>原則</h2><ul><li>管線帳號與權限最小化；正式環境部署需核准。</li><li>第三方 Action／套件／映像固定版本（最好以 commit SHA 或 digest）。</li><li>密鑰不進版控，由密鑰管理服務在執行期注入。</li><li>產出物可追溯：簽章、SBOM、建置紀錄。</li></ul><h2>子主題</h2><div id="children"></div>

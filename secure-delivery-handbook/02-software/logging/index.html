<h2>原則</h2><ul><li>記錄安全事件：認證、授權失敗、管理操作、資料匯出、輸入驗證失敗。</li><li>結構化日誌（JSON 鍵值）便於查詢與告警，也能降低日誌注入。</li><li><b>不記錄</b>密碼、token、完整卡號等機敏資料。</li><li>集中保存、防竄改、依合約與法規保存，並設定告警（見<a href="../../03-lifecycle/operations/monitoring-logging.html">監控與日誌</a>）。</li></ul><h2>子主題</h2><div id="children"></div>

  <h1>後端</h1>
  <p class="sub">伺服器端程式的安全：輸入處理、資料存取、對外請求與錯誤處理。</p>
</header>
<main class="page">
<h2>原則</h2><ul><li>所有外部輸入（請求、檔案、第三方 API 回應）都視為不可信。</li><li>資料存取用參數化介面；任何拼接進 SQL、命令、路徑、URL 的值都要有白名單。</li><li>對外請求（SSRF）：目的地走白名單，禁止指向內網與雲端中繼資料位址。</li><li>錯誤對外通用、對內詳細；失敗時預設拒絕。</li></ul><h2>子主題</h2><div id="children"></div>

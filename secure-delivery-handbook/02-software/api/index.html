<h2>原則</h2><ul><li>API 是攻擊面最大的入口：每個端點都需驗證、授權、輸入檢查與速率限制。</li><li>只回傳必要欄位；避免直接序列化資料庫實體。</li><li>維護 API 清單與版本，下線舊版本。</li><li>對外 API 以規格（OpenAPI）描述並納入契約測試。</li></ul><h2>子主題</h2><div id="children"></div>

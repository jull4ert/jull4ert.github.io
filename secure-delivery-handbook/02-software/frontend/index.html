  <h1>前端</h1>
  <p class="sub">瀏覽器端的安全：防止腳本注入、跨站請求偽造與不當的資源載入。</p>
</header>
<main class="page">
<h2>原則</h2><ul><li>前端<b>不可信</b>：任何驗證與授權都必須在伺服器端重做，前端檢查只是使用者體驗。</li><li>不要把機密（API 金鑰、內部網址、權限判斷）放進前端程式碼或打包產物。</li><li>第三方腳本等同給對方執行權限，需固定版本、加 SRI，並以 CSP 限制來源。</li><li>Session 憑證優先放 HttpOnly Cookie，避免放在 localStorage。</li></ul><h2>子主題</h2><div id="children"></div>

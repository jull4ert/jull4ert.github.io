<main class="page">
<h2>原則</h2><ul><li>應用程式用<b>專用最小權限帳號</b>，不用 sa／root／postgres 超級使用者。</li><li>資料庫不對公網開放；以網路層限制只有應用程式主機能連線。</li><li>傳輸加密（TLS）與靜態加密並用；敏感欄位視需求再做欄位層加密或遮罩。</li><li>備份同樣加密並限制存取。</li></ul><h2>子主題</h2><div id="children"></div>

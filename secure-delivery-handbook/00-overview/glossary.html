<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>名詞表｜資安交付手冊</title>

<body>
<header>
  <nav id="crumb" aria-label="麵包屑"></nav>
  <h1>名詞表</h1>
  <p class="sub">常見縮寫與術語，供與客戶溝通與閱讀其他頁面時查詢。</p>
</header>
<main class="page">
<p>縮寫的英文全名、中文名稱與簡介。內容頁中每個縮寫第一次出現時會加上虛線底線（滑鼠停留可看說明），頁底也有「本頁名詞」。</p>
<div id="glossary-list"><noscript>此頁需要 JavaScript 才能顯示名詞表。</noscript></div>
<div class="note">新增名詞：編輯 <code>assets/glossary.js</code> 的 DATA，加一行 <code>[縮寫, 英文全名, 中文, 簡介, [別名]]</code> 即可，所有頁面同步生效。</div>
<section class="refs"><h3>參考出處</h3><ul><li><a href="https://csrc.nist.gov/glossary">NIST 資安詞彙表</a></li><li><a href="https://owasp.org/www-community/Glossary">OWASP Glossary</a></li></ul></section>
</main>
<footer></footer>

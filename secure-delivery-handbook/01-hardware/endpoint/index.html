  <h1>終端裝置</h1>
  <p class="sub">開發者與維運人員的電腦握有原始碼、金鑰與正式環境權限，是高價值目標。</p>
</header>
<main class="page">
<h2>原則</h2><ul><li>所有工作用裝置納入管理（MDM／組態管理），有資產清單。</li><li><b>全碟加密</b>、自動鎖定螢幕、強制更新、端點防護（EDR／防毒）。</li><li><b>不使用本機管理員日常作業</b>；軟體安裝來源受控。</li><li>個人裝置（BYOD）存取公司資源需有政策與條件（加密、更新、遠端抹除）。</li><li>遺失或離職：能遠端鎖定與抹除，並撤銷憑證與金鑰。</li></ul><h2>子頁面</h2><div id="children"></div>

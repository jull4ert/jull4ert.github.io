  <h1>網路</h1>
  <p class="sub">把網路切成區段、預設拒絕、只開必要的路，並看得見流量。</p>
</header>
<main class="page">
<h2>原則</h2><ul><li><b>分段</b>：公網、DMZ、應用、資料庫、管理網各自隔離，區段之間以防火牆規則控管。</li><li><b>預設拒絕</b>：入站與跨區段都先全擋，再逐條開放並寫註解。</li><li><b>零信任思維</b>：不因「在內網」就信任，服務之間也驗證與授權。</li><li><b>可視性</b>：流量日誌、異常偵測與告警。</li></ul><h2>子頁面</h2><div id="children"></div>

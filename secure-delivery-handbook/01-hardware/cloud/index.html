  <h1>雲端</h1>
  <p class="sub">雲端省去硬體管理，但身分、設定與資料的安全責任仍在你。</p>

<main class="page">
<h2>原則</h2><ul><li>釐清<b>共同責任</b>，並以雲端帳號與權限作為新的邊界。</li><li>帳號分層（正式、測試、共用服務分開），以組織層級政策統一治理。</li><li>預設啟用稽核日誌與告警；公開暴露的資源要定期檢查。</li><li>基礎設施以程式碼管理（IaC）並掃描設定錯誤。</li></ul><h2>子頁面</h2><div id="children"></div>

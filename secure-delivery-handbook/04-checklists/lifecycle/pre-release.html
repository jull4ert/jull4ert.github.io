<div class="note">本頁由腳本從各來源頁面<b>自動彙整</b>，請到來源頁修改內容（點小節旁的「來源」）。勾選狀態依「專案」記錄在你的瀏覽器中，不會上傳。</div><h2>原始碼靜態分析（SAST）<a class="cl-src" href="../../03-lifecycle/pre-release/code-scan/sast.html">來源 ↗</a></h2><ul class="check"><li><label><input type="checkbox"> SAST 已納入 CI，PR 會自動執行</label></li><li><label><input type="checkbox"> 嚴重／高風險告警會阻擋合併</label></li><li><label><input type="checkbox"> 誤報有記錄與核可流程</label></li><li><label><input type="checkbox"> 掃描報告隨版本留存</label></li></ul><h2>第三方依賴與 SBOM<a class="cl-src" href="../../03-lifecycle/pre-release/code-scan/dependency.html">來源 ↗</a></h2><ul class="check"><li><label><input type="checkbox"> 有 lock file 且已提交版控</label></li><li><label><input type="checkbox"> CI 內有依賴漏洞掃描，高風險會阻擋</label></li><li><label><input type="checkbox"> 已產生 SBOM 並隨版本存檔</label></li><li><label><input type="checkbox"> 已啟用自動升版通知</label></li><li><label><input type="checkbox"> CDN 腳本已加 SRI 並固定版本</label></li></ul><h2>機敏資訊外洩掃描<a class="cl-src" href="../../03-lifecycle/pre-release/code-scan/secrets.html">來源 ↗</a></h2><ul class="check"><li><label><input type="checkbox"> 倉庫與歷史已掃描，無未處理的機敏資訊</label></li><li><label><input type="checkbox"> 正式環境金鑰不存在於程式碼，且與測試環境不同</label></li><li><label><input type="checkbox"> 已啟用 pre-commit 與 CI 掃描</label></li><li><label><input type="checkbox"> 前端打包產物未含後端金鑰</label></li></ul><h2>TLS／HTTPS 設定<a class="cl-src" href="../../03-lifecycle/pre-release/web-hardening/tls.html">來源 ↗</a></h2><ul class="check"><li><label><input type="checkbox"> 僅啟用 TLS 1.2／1.3</label></li><li><label><input type="checkbox"> SSL Labs 評等 A 以上（或客戶約定等級）</label></li><li><label><input type="checkbox"> 憑證有效期已加入監控，且有續期機制</label></li><li><label><input type="checkbox"> HTTP 一律轉 HTTPS，無混合內容（mixed content）</label></li><li><label><input type="checkbox"> 已啟用 HSTS</label></li></ul><h2>HTTP 安全標頭與 Cookie<a class="cl-src" href="../../03-lifecycle/pre-release/web-hardening/http-headers.html">來源 ↗</a></h2><ul class="check"><li><label><input type="checkbox"> CSP 已啟用（或已有 Report-Only 觀察計畫）</label></li><li><label><input type="checkbox"> nosniff、Referrer-Policy、Permissions-Policy 已設定</label></li><li><label><input type="checkbox"> 已禁止被嵌入，或僅允許指定來源</label></li><li><label><input type="checkbox"> Session Cookie 具 Secure、HttpOnly、SameSite</label></li><li><label><input type="checkbox"> 版本資訊標頭已移除</label></li><li><label><input type="checkbox"> CORS 為白名單，非萬用字元</label></li></ul><h2>弱點掃描（DAST／主機）<a class="cl-src" href="../../03-lifecycle/pre-release/vulnerability-scan.html">來源 ↗</a></h2><ul class="check"><li><label><input type="checkbox"> 已取得書面授權與掃描時段</label></li><li><label><input type="checkbox"> 掃描對象為預備環境，設定與正式一致</label></li><li><label><input type="checkbox"> 已跑未登入與已登入兩輪</label></li><li><label><input type="checkbox"> 誤報已人工排除並記錄理由</label></li><li><label><input type="checkbox"> 嚴重／高風險項目皆已修補並重掃通過</label></li><li><label><input type="checkbox"> 掃描報告已留存並附於驗收文件</label></li></ul><h2>滲透測試<a class="cl-src" href="../../03-lifecycle/pre-release/pentest.html">來源 ↗</a></h2><h3 class="cl-sec">委託前確認</h3><ul class="check"><li><label><input type="checkbox"> 簽署授權書與測試規則（範圍、時段、禁止項目）</label></li><li><label><input type="checkbox"> 在預備環境測試，並備妥資料備份</label></li><li><label><input type="checkbox"> 約定報告格式：重現步驟、影響、嚴重度、修補建議</label></li><li><label><input type="checkbox"> 約定修補後的<b>複測</b></label></li><li><label><input type="checkbox"> 測試資料不含真實個資，或已簽保密條款</label></li></ul><h2>驗收與 Go/No-Go<a class="cl-src" href="../../03-lifecycle/pre-release/acceptance.html">來源 ↗</a></h2><h3 class="cl-sec">上線前總檢查清單</h3><ul class="check"><li><label><input type="checkbox"> 所有掃描報告已留存</label></li><li><label><input type="checkbox"> 正式環境的金鑰、資料庫密碼已與開發／測試環境分離並重新產生</label></li><li><label><input type="checkbox"> 除錯模式、範例頁、管理介面預設路徑已關閉或限制來源 IP</label></li><li><label><input type="checkbox"> 預設帳密已移除，管理帳號啟用 MFA</label></li><li><label><input type="checkbox"> 資料庫不對公網開放，僅允許應用程式主機連入</label></li><li><label><input type="checkbox"> 錯誤頁不洩漏堆疊與版本資訊</label></li><li><label><input type="checkbox"> 日誌不記錄密碼、token、完整個資</label></li><li><label><input type="checkbox"> 已備妥回滾計畫與事故聯絡窗口</label></li><li><label><input type="checkbox"> 已向客戶交付資安報告與已知殘餘風險清單</label></li></ul>
